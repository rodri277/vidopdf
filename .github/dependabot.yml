version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to the active LTS in .nvmrc, so type definitions must match it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Held back for compatibility until typescript-eslint and jsx-a11y catch up (ADR 008).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
